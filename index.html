<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assistente de Pré-Vendas G4</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #1f2937; padding: 24px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: #111827; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  h1 { font-size: 20px; font-weight: 600; }
  .sub { color: #6b7280; font-size: 14px; margin: 4px 0 18px; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; }
  input { flex: 1; height: 44px; padding: 0 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; outline: none; }
  input:focus { border-color: #111827; box-shadow: 0 0 0 3px rgba(17,24,39,.12); }
  button.go { height: 44px; padding: 0 22px; border: none; border-radius: 10px; background: #111827; color: #fff; font-weight: 500; font-size: 15px; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: not-allowed; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .chip { font-size: 13px; padding: 5px 12px; border-radius: 999px; background: #fff; border: 1px solid #e5e7eb; color: #4b5563; cursor: pointer; }
  .status { text-align: center; color: #6b7280; padding: 40px 0; }
  .alert { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 10px; padding: 12px; font-size: 14px; }
  .alert .d { margin-top: 6px; font-size: 12px; font-family: monospace; color: #ef4444; word-break: break-word; }
  .warn { background: #fffbeb; border: 1px solid #fde68a; color: #b45309; border-radius: 10px; padding: 9px 12px; font-size: 12px; font-family: monospace; margin-bottom: 12px; word-break: break-word; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .tag { display: inline-block; background: #111827; color: #fff; font-weight: 500; padding: 5px 14px; border-radius: 9px; }
  .copy { font-size: 13px; padding: 7px 12px; border: 1px solid #d1d5db; border-radius: 9px; background: #fff; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 13px; padding: 14px 16px; }
  .card.wide { grid-column: 1 / -1; }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 9px; display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; }
  .card ul { list-style: none; } .card li { font-size: 13px; color: #4b5563; line-height: 1.55; margin-bottom: 7px; }
  .card li b { color: #111827; font-weight: 600; }
  .vocab span { display: inline-block; background: #f3f4f6; color: #374151; font-size: 12px; padding: 4px 10px; border-radius: 7px; margin: 0 6px 6px 0; }
  .empty { text-align: center; color: #9ca3af; padding: 50px 10px; }
  .gate { max-width: 360px; margin: 60px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 22px; text-align: center; }
  .gate input { width: 100%; margin: 14px 0; }
  .gate button { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">G4</div><h1>Assistente de Pré-Vendas</h1></div>
  <div class="sub">Inteligência de mercado + playbook por segmento, para a chamada</div>

  <div id="gate" class="gate" style="display:none">
    <div style="font-weight:600;margin-bottom:4px">Código de acesso</div>
    <div style="font-size:13px;color:#6b7280">Peça ao seu coordenador</div>
    <input type="password" id="code" placeholder="••••••" />
    <button class="go" id="enter" style="width:100%">Entrar</button>
  </div>

  <div id="app" style="display:none">
    <div class="row">
      <input type="text" id="segmento" placeholder="Ex: Construtoras, Clínicas, E-commerce de moda..." />
      <button class="go" id="analisar">Analisar</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="output"><div class="empty">Digite o segmento do lead para gerar o briefing.</div></div>
  </div>
</div>
<script src="app.js"></script>
<script>
/* fallback: inline para quem salvar sem app.js separado */
</script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let history = [];
let CODE = sessionStorage.getItem("g4_code") || "";

function showApp(){ $("gate").style.display="none"; $("app").style.display="block"; }
if (CODE) showApp(); else $("gate").style.display="block";

$("enter").addEventListener("click", () => {
  CODE = $("code").value.trim();
  sessionStorage.setItem("g4_code", CODE);
  showApp();
});
$("analisar").addEventListener("click", () => analisar());
$("segmento").addEventListener("keydown", (e) => { if (e.key === "Enter") analisar(); });

async function getPart(segmento, kind) {
  const r = await fetch("/api/briefing", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-access-code": CODE },
    body: JSON.stringify({ segmento, kind }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ("HTTP " + r.status)); }
  return r.json();
}

async function analisar(seg) {
  const target = (seg || $("segmento").value).trim();
  if (!target) return;
  $("segmento").value = target;
  $("analisar").disabled = true;
  $("output").innerHTML = '<div class="status">Analisando mercado e montando o playbook…</div>';

  let mercado=null, playbook=null, err="";
  const [rM, rP] = await Promise.allSettled([getPart(target,"mercado"), getPart(target,"playbook")]);
  if (rM.status==="fulfilled") mercado=rM.value; else err="Mercado: "+rM.reason.message;
  if (rP.status==="fulfilled") playbook=rP.value; else err=(err?err+" | ":"")+"Playbook: "+rP.reason.message;
  $("analisar").disabled = false;

  if (!mercado && !playbook) { $("output").innerHTML = `<div class="alert">Não consegui gerar o briefing.<div class="d">${esc(err)}</div></div>`; return; }
  if (!history.includes(target)) { history=[target,...history].slice(0,6); renderChips(); }
  render({ segmento: target, ...(mercado||{}), ...(playbook||{}) }, err);
}

function renderChips(){
  $("chips").innerHTML = history.map((h)=>`<span class="chip" data-s="${esc(h)}">${esc(h)}</span>`).join("");
  document.querySelectorAll(".chip").forEach((c)=>c.addEventListener("click",()=>analisar(c.dataset.s)));
}
const li = (a)=>(a||[]).map((x)=>`<li>${esc(x)}</li>`).join("");

function render(b, err){
  const card=(c,t,inner,wide)=>`<div class="card${wide?' wide':''}"><h3><span class="dot" style="background:${c}"></span>${t}</h3>${inner}</div>`;
  let h="";
  if (err) h+=`<div class="warn">Parcial — ${esc(err)}</div>`;
  h+=`<div class="bar"><span class="tag">${esc(b.segmento)}</span><button class="copy" id="cp">Copiar briefing</button></div><div class="grid">`;
  if (b.dores_principais) h+=card("#dc2626","Principais dores",`<ul>${li(b.dores_principais)}</ul>`);
  if (b.mercado) h+=card("#059669","Mercado no Brasil",`<ul><li>${esc(b.mercado.resumo)}</li><li><b>${esc(b.mercado.numeros)}</b></li></ul>`);
  if (b.noticias) h+=card("#2563eb","Notícias recentes",`<ul>${(b.noticias||[]).map(n=>`<li><b>${esc(n.titulo)}</b> — ${esc(n.contexto)}</li>`).join("")}</ul>`);
  if (b.tendencias) h+=card("#d97706","Tendências 2026/2027",`<ul>${li(b.tendencias)}</ul>`);
  if (b.perfil_decisor) h+=card("#7c3aed","Perfil do decisor",`<ul><li>${esc(b.perfil_decisor)}</li></ul>`,true);
  if (b.gatilhos) h+=card("#4f46e5","Gatilhos de conexão (G4)",`<ul>${li(b.gatilhos)}</ul>`);
  if (b.perguntas_spin) h+=card("#0d9488","Perguntas de descoberta",`<ul>${li(b.perguntas_spin)}</ul>`);
  if (b.objecoes) h+=card("#db2777","Objeções + contorno",`<ul>${(b.objecoes||[]).map(o=>`<li><b>"${esc(o.objecao)}"</b><br>→ ${esc(o.resposta)}</li>`).join("")}</ul>`,true);
  if (b.vocabulario) h+=card("#6b7280","Vocabulário do setor",`<div class="vocab">${(b.vocabulario||[]).map(v=>`<span>${esc(v)}</span>`).join("")}</div>`,true);
  h+="</div>";
  $("output").innerHTML=h;
  const cp=$("cp");
  if (cp) cp.addEventListener("click",()=>{
    const t=`BRIEFING — ${b.segmento}\n\nDORES\n${(b.dores_principais||[]).map(x=>"- "+x).join("\n")}\n\nMERCADO\n${b.mercado?.resumo||""}\n${b.mercado?.numeros||""}\n\nNOTÍCIAS\n${(b.noticias||[]).map(n=>"- "+n.titulo+" — "+n.contexto).join("\n")}\n\nTENDÊNCIAS\n${(b.tendencias||[]).map(x=>"- "+x).join("\n")}\n\nPERFIL\n${b.perfil_decisor||""}\n\nGATILHOS\n${(b.gatilhos||[]).map(x=>"- "+x).join("\n")}\n\nPERGUNTAS\n${(b.perguntas_spin||[]).map(x=>"- "+x).join("\n")}\n\nOBJEÇÕES\n${(b.objecoes||[]).map(o=>'- "'+o.objecao+'" → '+o.resposta).join("\n")}\n\nVOCABULÁRIO\n${(b.vocabulario||[]).join(", ")}`;
    navigator.clipboard.writeText(t); cp.textContent="Copiado ✓"; setTimeout(()=>cp.textContent="Copiar briefing",1500);
  });
}
</script>
</body>
</html>
